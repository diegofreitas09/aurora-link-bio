[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


[[redirects]]
  from = "/bio"
  to = "/bio.html"
  status = 200


# Link da bio: o subdomínio abre diretamente a página de links
[[redirects]]
  from = "/"
  to = "/bio.html"
  status = 200
  force = true
  conditions = {Host = ["bio.crecheescolaaurora.com.br"]}

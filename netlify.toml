[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


[[redirects]]
  from = "/bio"
  to = "/bio.html"
  status = 200


# Link da bio: reescreve somente a raiz do subdomínio para a página de links
[[redirects]]
  from = "https://bio.crecheescolaaurora.com.br/"
  to = "/bio.html"
  status = 200
  force = true

[[redirects]]
  from = "http://bio.crecheescolaaurora.com.br/"
  to = "/bio.html"
  status = 200
  force = true

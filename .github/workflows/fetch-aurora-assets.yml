name: Sync Aurora mural assets

on:
  push:
    branches: [site-institucional-aurora]
    paths:
      - '.github/workflows/fetch-aurora-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-institucional-aurora

      - name: Fetch high-resolution mural photos
        env:
          URL1: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F2872b248-dab7-43df-ba02-e399fda19a15/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAJIMvAwHDmUvrn5iCyxqkZcTSdmnrJbPuCrr9TWO5xgS&exp=1791399195&osig=AAAAAAAAAAAAAAAAAAAAAEwYaqRlnyespcmYrNwgho-M_fYCu14Q3AjfIGRHqhjQ&signer=media-rpc&token=AAIAAU0AJDI4NzJiMjQ4LWRhYjctNDNkZi1iYTAyLWUzOTlmZGExOWExNQAAAAABoRe2cXiM7sZDcPSaxaW0nIekGu-mrFVgk6C2-LFe_mac9uAdEA&x-canva-quality=thumbnail'
          URL2: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F6dccf5b0-5f27-47aa-8491-97227d0003af/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAF_FmMfvxYCcL-NNkYFdf_3SaxOrUgMoUkH6Pf3470Sg&exp=1791396811&osig=AAAAAAAAAAAAAAAAAAAAAEFIo2fFRoTaXy8ObT1VOUZOaSRVMDi6gBs3-mM-JUcv&signer=media-rpc&token=AAIAAU0AJDZkY2NmNWIwLTVmMjctNDdhYS04NDkxLTk3MjI3ZDAwMDNhZgAAAAABoReSEPgNv40pkikIgP1MvN2Qg8uEMCQ-h2Lwe-ShABCQwEEsvw&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets/mural
          python - <<'PY'
          import os, urllib.request, struct

          def png_size(data):
              if data[:8] != b'\x89PNG\r\n\x1a\n' or len(data) < 24:
                  return (0,0)
              return struct.unpack(">II", data[16:24])

          def candidates(u):
              out=[]
              out.append(u.replace('/height:200/','/height:1402/').replace('/width:160?','/width:1122?').replace('x-canva-quality=thumbnail','x-canva-quality=screen'))
              out.append(u.replace('/height:200/','/height:1402/').replace('/width:160?','/width:1122?'))
              out.append(u.replace('x-canva-quality=thumbnail','x-canva-quality=screen'))
              out.append(u)
              return out

          def fetch(src, dest):
              best=None
              for i,u in enumerate(candidates(src),1):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                      data=urllib.request.urlopen(req,timeout=30).read()
                      w,h=png_size(data)
                      print(dest,'candidate',i,'status ok',len(data),'bytes',w,h)
                      if best is None or w*h > best[0]*best[1]:
                          best=(w,h,data)
                      if w >= 900 and h >= 1100:
                          break
                  except Exception as e:
                      print(dest,'candidate',i,'failed',repr(e))
              if not best:
                  raise SystemExit('Unable to fetch '+dest)
              open(dest,'wb').write(best[2])
              print('saved',dest,best[0],best[1],len(best[2]))

          fetch(os.environ['URL1'],'assets/mural/aurora-ambiente.png')
          fetch(os.environ['URL2'],'assets/mural/aurora-sensorial.png')
          PY

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mural/aurora-ambiente.png assets/mural/aurora-sensorial.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: adiciona fotos reais em alta qualidade ao mural"
          git push origin HEAD:site-institucional-aurora
